[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kemono-parser"
version = "1.0.0"
description = "Модульный парсер для Kemono/Coomer API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["kemono", "coomer", "parser", "downloader", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=0.21.0",
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
include = ["api*", "cli*", "config*", "core*", "downloaders*", "modules*", "storage*", "utils*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]
proxy = [
    "requests[socks]>=2.28.0",
]

[project.scripts]
kemono-parser = "cli.commands:cli"

[project.urls]
Homepage = "https://github.com/yourusername/kemono-parser"
Repository = "https://github.com/yourusername/kemono-parser.git"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true